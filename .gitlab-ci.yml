variables:
  BACKEND_DIR: "backend"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

stages:
  - lint
  - test
  - security
  - build
  - image-scan
# ---------- 1. LINT ----------
lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install flake8
    - flake8 $BACKEND_DIR --max-line-length=120 --exclude=.venv,__pycache__
  allow_failure: true   # remove this line once the code is clean

# ---------- 2. TEST ----------
test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r $BACKEND_DIR/requirements.txt pytest
    - pytest -q || [ $? -eq 5 ]   # exit code 5 = "no tests found", accepted
  allow_failure: true   # remove this line once you have real tests

# ---------- 3. SECURITY ----------
secrets-scan:            # passwords / tokens committed by mistake
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths: [gitleaks-report.json]
  allow_failure: true

sast-bandit:             # insecure Python code
  stage: security
  image: python:3.12-slim
  script:
    - pip install bandit
    - bandit -r $BACKEND_DIR -ll -f json -o bandit-report.json || (bandit -r $BACKEND_DIR -ll; exit 1)
  artifacts:
    when: always
    paths: [bandit-report.json]
  allow_failure: true

dependency-scan:         # vulnerable Python libraries
  stage: security
  image: python:3.12-slim
  script:
    - pip install pip-audit
    - pip-audit -r $BACKEND_DIR/requirements.txt
  allow_failure: true

k8s-scan:                # bad practices in Kubernetes YAML files
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 k8s/
  rules:
    - exists:
        - k8s/**/*.yaml
        - k8s/**/*.yml
  allow_failure: true

sonarqube:               # needs SONAR_TOKEN in Settings > CI/CD > Variables
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
  rules:
    - if: $SONAR_TOKEN
  allow_failure: true

# ---------- 4. BUILD IMAGE ----------
docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker build -t predimaint-backend:$CI_COMMIT_SHORT_SHA $BACKEND_DIR
    - docker save -o image.tar predimaint-backend:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths: [image.tar]
    expire_in: 1 hour
  rules:
    - exists:
        - $BACKEND_DIR/Dockerfile

# ---------- 5. SCAN THE IMAGE ----------
trivy-image:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1
  needs: [docker-build]
  allow_failure: true
  rules:
    - exists:
        - $BACKEND_DIR/Dockerfile
